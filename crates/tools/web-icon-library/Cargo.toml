[package]
name = "waple-tools-tool-web-icon-library"
version.workspace = true
edition.workspace = true

[features]
# 추가 설치용 DLL로 빌드할 때 (cargo rustc --features addon --crate-type cdylib)
addon = []

[dependencies]
waple-tools-core.workspace = true
waple-tools-addon-abi.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# PNG 미리보기를 data: URL로 넘긴다 (MIT OR Apache-2.0, misc-qr이 이미 쓰는 버전)
base64 = "0.22"
# 고른 아이콘 SVG → PNG 렌더링과 SVG 본문 정리용 XML 파서(usvg가 다시 내보내는 roxmltree) (Apache-2.0 OR MIT, Cargo.lock에 이미 있음).
# 아이콘에는 글자·래스터 이미지가 없어(정리에서 버림) 텍스트·폰트·래스터 기능은 끈다
resvg = { version = "0.49", default-features = false }

[dev-dependencies]
tempfile.workspace = true
waple-tools-addon-abi = { workspace = true, features = ["host", "testkit"] }
