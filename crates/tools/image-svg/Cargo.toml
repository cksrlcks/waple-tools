[package]
name = "waple-tools-tool-image-svg"
version.workspace = true
edition.workspace = true

[features]
# 추가 설치용 DLL로 빌드할 때 (cargo rustc --features addon --crate-type cdylib)
addon = []

[dependencies]
waple-tools-core.workspace = true
waple-tools-addon-abi.workspace = true
waple-tools-image-common.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# SVG 안 data: 이미지의 가로·세로를 헤더만 읽어 확인한다 (image-common이 이미 쓰는 의존성)
image.workspace = true
# SVG → PNG 렌더링, 순수 Rust (Apache-2.0 OR MIT). 최적화의 XML 파서(roxmltree)·폰트(fontdb)도 이걸 통해 쓴다. svgz는 받지 않아 끈다
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
# path d 파싱 (Apache-2.0 OR MIT). usvg가 이미 쓰는 버전이라 새 크레이트가 늘지 않는다
svgtypes = "0.16"

[dev-dependencies]
tempfile.workspace = true
waple-tools-addon-abi = { workspace = true, features = ["host", "testkit"] }
