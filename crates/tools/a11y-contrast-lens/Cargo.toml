[package]
name = "waple-tools-tool-a11y-contrast-lens"
version.workspace = true
edition.workspace = true

[features]
# 추가 설치용 DLL로 빌드할 때 (cargo rustc --features addon --crate-type cdylib)
addon = []

[dependencies]
waple-tools-core.workspace = true
waple-tools-addon-abi.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# 글자 영역 검출(PP-OCRv5 mobile det): 다른 AI 도구와 같은 공용 크레이트·이미지 크레이트
waple-tools-ai-common.workspace = true
image.workspace = true
# 렌즈 창 · 화면 캡처: Win32 (MIT OR Apache-2.0). 잠금 파일에 이미 있는 버전
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
waple-tools-addon-abi = { workspace = true, features = ["host", "testkit"] }
