[package]
name = "waple-tools-tool-image-watermark"
version.workspace = true
edition.workspace = true

[features]
# 추가 설치용 DLL로 빌드할 때 (cargo rustc --features addon --crate-type cdylib)
addon = []

[dependencies]
waple-tools-core.workspace = true
waple-tools-addon-abi.workspace = true
waple-tools-image-common.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
image.workspace = true
# 텍스트 워터마크: TTF·TTC 글리프 래스터라이즈, 순수 Rust (Apache-2.0)
ab_glyph = "0.2"

[dev-dependencies]
tempfile.workspace = true
waple-tools-image-common = { workspace = true, features = ["testkit"] }
waple-tools-addon-abi = { workspace = true, features = ["host", "testkit"] }
