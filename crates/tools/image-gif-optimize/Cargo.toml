[package]
name = "waple-tools-tool-image-gif-optimize"
version.workspace = true
edition.workspace = true

[features]
# 추가 설치용 DLL로 빌드할 때 (cargo rustc --features addon --crate-type cdylib)
addon = []

[dependencies]
waple-tools-core.workspace = true
waple-tools-addon-abi.workspace = true
waple-tools-image-common.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
image.workspace = true
# GIF 저장(전역 팔레트·프레임 위치·지우기 방식)과 반복 횟수 읽기. image가 쓰는 것과 같은 버전 (MIT OR Apache-2.0)
gif = "0.14"
# 모든 프레임 공용 팔레트 양자화(NeuQuant). image·gif가 이미 쓰는 것 (MIT)
color_quant = "1.1"

[dev-dependencies]
tempfile.workspace = true
waple-tools-image-common = { workspace = true, features = ["testkit"] }
waple-tools-addon-abi = { workspace = true, features = ["host", "testkit"] }
