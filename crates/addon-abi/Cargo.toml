[package]
name = "waple-tools-addon-abi"
version.workspace = true
edition.workspace = true

[features]
# 앱 쪽: DLL을 읽어 Tool로 감싼다
host = ["dep:libloading"]
# 테스트용: 도구 크레이트를 DLL로 빌드한다
testkit = []

[dependencies]
waple-tools-core.workspace = true
serde.workspace = true
serde_json.workspace = true
libloading = { version = "0.8", optional = true }
