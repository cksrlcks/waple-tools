[package]
name = "waple-tools"
version.workspace = true
edition.workspace = true
description = "waple tools"

[lib]
# Windows에서 bin 이름과 겹치지 않도록 _lib 접미사
name = "waple_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 앱 자동 업데이트 (GitHub Releases만, 서명 확인) · 설치 후 다시 시작
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
waple-tools-core.workspace = true
waple-tools-builtin = { path = "../../crates/builtin" }
waple-tools-image-common.workspace = true
base64 = "0.22"
# 미리보기용 가운데 조각을 둘 임시 폴더 (core·도구 테스트와 같은 크레이트, MIT/Apache-2.0)
tempfile.workspace = true
# 추가 설치 도구: DLL 로드, 다운로드(updater와 같은 reqwest·rustls), 서명·해시 확인
waple-tools-addon-abi = { workspace = true, features = ["host"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
minisign-verify = "0.3"
sha2 = "0.10"

[dev-dependencies]
# 테스트에서 임시 키로 서명 (MIT)
minisign = "0.10"
waple-tools-addon-abi = { workspace = true, features = ["host", "testkit"] }

