[package]
name = "localtools"
version.workspace = true
edition.workspace = true
description = "LocalTools"

[lib]
# Windows에서 bin 이름과 겹치지 않도록 _lib 접미사
name = "localtools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
localtools-core.workspace = true
localtools-builtin = { path = "../../crates/builtin" }
localtools-tool-dev-copy = { path = "../../crates/tools/dev-copy" }

[dev-dependencies]
tempfile.workspace = true
