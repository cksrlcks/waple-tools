<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>waple tools</title>
  </head>

  <body>
    <div id="root"></div>
    <!--
      시작 화면: 처음엔 배경만. 앱을 처음 켤 때만 JS가 애니메이션·문구를 띄우고, 새로고침이면 바로 없앤다.
      위치·크기는 인라인으로: CSS가 늦게 붙는 동안에도 가운데에 뜨게
    -->
    <div
      id="splash"
      class="bg-background"
      style="position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; transition: opacity 300ms"
    >
      <!-- 로고 애니메이션 자리 (800×200 구성, 로고 폭 224px) -->
      <div id="splash-anim" class="dark:invert" style="display: none; width: 256px; height: 64px"></div>
      <p id="splash-text" class="text-muted-foreground" style="display: none; margin: 0; font-size: 12px">
        도구를 준비하는 중<span class="splash-dot">.</span><span class="splash-dot">.</span><span class="splash-dot">.</span>
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
