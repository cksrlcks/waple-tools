[workspace]
resolver = "3"
members = ["crates/core", "crates/addon-abi", "crates/builtin", "crates/cli", "crates/tools/*", "app/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
thiserror = "2"
tempfile = "3"
waple-tools-core = { path = "crates/core" }
waple-tools-addon-abi = { path = "crates/addon-abi" }
waple-tools-image-common = { path = "crates/tools/image-common" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
mozjpeg = "0.10"
webp = "0.3"
oxipng = { version = "9", default-features = false, features = ["parallel"] }
img-parts = "0.3"
kamadak-exif = "0.6"
waple-tools-pdf-common = { path = "crates/tools/pdf-common" }
waple-tools-pdf-render = { path = "crates/tools/pdf-render" }
# PDF 구조 편집 (MIT). 기본 기능(chrono·rayon)은 쓰지 않는다
lopdf = { version = "0.47", default-features = false }
# PDF 페이지 렌더링, 순수 Rust (Apache-2.0 OR MIT). 기본 기능 = 표준 14 글꼴·CMap 내장
hayro = "0.9"

# 크기 최적화 (https://tauri.app/concept/size/). panic = "abort"는 쓰지 않는다: 도구 패닉을 catch_unwind로 잡아야 함
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# 개발 모드에서도 외부 크레이트(이미지 디코딩·인코딩)는 최적화: 미리보기가 수십 배 느려지는 것을 막는다. 우리 코드는 디버깅용 그대로
[profile.dev.package."*"]
opt-level = 3
