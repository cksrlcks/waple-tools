[workspace]
resolver = "3"
members = ["crates/core", "crates/tools/*", "app/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
thiserror = "2"
tempfile = "3"
localtools-core = { path = "crates/core" }

# 크기 최적화 (https://tauri.app/concept/size/). panic = "abort"는 쓰지 않는다: 도구 패닉을 catch_unwind로 잡아야 함
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
