# 릴리스: v로 시작하는 태그를 push하면 Windows 설치 파일 + 업데이트 파일(서명) + latest.json을 Releases에 올린다.
# 앱은 releases/latest/download/latest.json을 보고 자동 업데이트한다.
# 필요한 저장소 Secrets: TAURI_SIGNING_PRIVATE_KEY (업데이트 서명 비밀키), TAURI_SIGNING_PRIVATE_KEY_PASSWORD (없으면 빈 값)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: 프론트 의존성
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "waple tools ${{ github.ref_name }}"
          releaseBody: "변경 사항은 커밋 기록을 참고하세요."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
