# 릴리스: v로 시작하는 태그를 push하면 Windows 설치 파일 + 업데이트 파일(서명) + latest.json을 Releases에 올린다.
# 앱은 releases/latest/download/latest.json을 보고 자동 업데이트한다.
# 필요한 저장소 Secrets: TAURI_SIGNING_PRIVATE_KEY (업데이트 서명 비밀키), TAURI_SIGNING_PRIVATE_KEY_PASSWORD (없으면 빈 값)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # main에서 cache.yml이 채운 캐시를 읽기만 한다 (태그 실행이 저장한 캐시는 다른 태그가 못 읽음)
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false

      - name: 프론트 의존성
        working-directory: app
        run: npm ci

      # 릴리스 설명: CHANGELOG.md에서 이 태그(## vX.Y.Z) 부분만 꺼낸다
      - name: 변경 사항 읽기
        id: notes
        shell: bash
        run: |
          body=$(awk -v tag="$GITHUB_REF_NAME" '/^## /{p = ($2 == tag); next} p' CHANGELOG.md)
          [ -n "$body" ] || body="변경 사항은 커밋 기록을 참고하세요."
          { echo "body<<NOTES_EOF"; echo "$body"; echo "NOTES_EOF"; } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "waple tools ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
